[post-start]
copy = "wt step copy-ignored"

[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"

[projects]

[list]
json-schema = 1

[projects."github.com/canteralabor/cantera"]
post-start.install = "pnpm install --frozen-lockfile"
step.copy-ignored.exclude = ["node_modules",".next", ".turbo", ".env.local"]
